# CI quality gates (docs/08 §4):
# lint+types → unit+integration+API+contract (+coverage, BR traceability, schema) → OpenAPI drift
# → build images → E2E (Chromium) + axe on the compose stack.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.13.7"
  PNPM_VERSION: "12.16.1"
  NODE_VERSION: "24"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true, cache-dependency-glob: backend/uv.lock }
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: cd backend && uv sync --frozen
      - run: cd frontend && pnpm install --frozen-lockfile
      - name: ruff, mypy, import-linter, eslint, tsc, prettier
        run: make lint

  backend-tests:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libmagic1
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true, cache-dependency-glob: backend/uv.lock }
      - run: cd backend && uv sync --frozen
      - name: unit + integration + API + contract (testcontainers PostgreSQL 16, MinIO)
        run: cd backend && uv run pytest -n auto -m "not timing" --cov=tcms --cov-branch --cov-report=json --cov-report=term
      - name: timing-sensitive tests (serial)
        run: cd backend && uv run pytest -m timing -q
      - name: coverage gate (service/rules/reporting)
        run: cd backend && uv run python scripts/coverage_gate.py coverage.json

  frontend-tests:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: cd frontend && pnpm install --frozen-lockfile && pnpm test

  openapi-drift:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libmagic1
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true, cache-dependency-glob: backend/uv.lock }
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: cd backend && uv sync --frozen
      - run: cd frontend && pnpm install --frozen-lockfile
      - name: generated client equals committed client
        run: make api-client-check

  dependency-audit:
    # docs/08 §4, M8 D14: known vulnerabilities in runtime dependencies fail the build.
    # Accepted exceptions (with expiry) live in security/exceptions.md and are passed as --ignore-vuln.
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true, cache-dependency-glob: backend/uv.lock }
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - name: pip-audit (runtime dependencies from uv.lock)
        run: |
          cd backend
          uv export --frozen --no-dev --no-hashes --no-emit-project > /tmp/requirements.txt
          uvx --python 3.12 --from "pip-audit>=2.9,<3" pip-audit --requirement /tmp/requirements.txt --disable-pip --no-deps --strict
      - name: pnpm audit (production dependencies, high and critical)
        run: cd frontend && pnpm install --frozen-lockfile && pnpm audit --prod --audit-level high
  images:
    needs: [backend-tests, frontend-tests, openapi-drift, dependency-audit]
    runs-on: ubuntu-24.04
    env:
      # Pinned by digest (the trivy-action and image releases were compromised in March 2026).
      TRIVY: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    steps:
      - uses: actions/checkout@v5
      - run: docker build --pull -f backend/Dockerfile --target runtime -t assay-backend:${{ github.sha }} .
      - run: docker build --pull -f frontend/Dockerfile --target runtime -t assay-web:${{ github.sha }} .
      - name: Trivy (HIGH and CRITICAL with a fix available fail the build)
        run: |
          for image in assay-backend assay-web; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/security:/security:ro" "$TRIVY" \
              image --quiet --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /security/trivyignore \
              --exit-code 1 "$image:${{ github.sha }}"
          done

  e2e:
    needs: images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: cd frontend && pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - name: start stack, migrate, seed
        run: make up && make migrate && make seed
      - name: Playwright (Chromium) + axe
        run: make e2e
        env: { CI: "true" }
      - if: failure()
        run: docker compose logs --tail 200
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: frontend/playwright-report, if-no-files-found: ignore }

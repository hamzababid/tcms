# Nightly security scan (docs/08 §8, M8 D14): OWASP ZAP baseline (passive) against the CI stack.
# A FAIL rule fails the run; accepted findings are listed in security/zap-rules.tsv and security/exceptions.md.
name: nightly
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zap-baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: start stack, migrate, seed
        run: make up && make migrate && make seed
      - name: ZAP baseline (web app and API)
        run: |
          mkdir -p zap && chmod 777 zap
          for target in http://localhost:5173 http://localhost:8000/api/v1/health/ready; do
            docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" -v "$PWD/security:/zap/rules:ro" \
              ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t "$target" -c /zap/rules/zap-rules.tsv \
              -r "report-$(echo "$target" | tr -c 'a-z0-9' '-').html"
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: zap-reports, path: zap, if-no-files-found: ignore }

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Top bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<header style="width: 100%; min-height: 60px; box-sizing: border-box; padding: 10px 24px; background: #FFFFFF; border-bottom: 1px solid #E2E8F0; font-family: Inter, system-ui, sans-serif; display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
  <nav aria-label="Breadcrumb" style="display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: #475569; min-width: 0; flex: 1 1 320px">
    <sc-for list="{{crumbs}}" as="c" hint-placeholder-count="3">
      <span style="{{c.style}}">{{c.label}}</span>
      <sc-if value="{{c.sep}}" hint-placeholder-val="{{ true }}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </sc-if>
    </sc-for>
  </nav>
  <button type="button" style="display: flex; align-items: center; gap: 8px; width: 320px; max-width: 100%; height: 36px; padding: 0 10px; border: 1px solid #E2E8F0; border-radius: 6px; background: #F8FAFC; color: #64748B; font: 400 13.5px Inter, sans-serif; text-align: left">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    Search cases, defects, keys…
    <kbd style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; padding: 1px 6px; border: 1px solid #CBD5E1; border-radius: 4px; background: #FFFFFF; color: #475569">/</kbd>
  </button>
  <button type="button" aria-label="Notifications, 3 unread" style="position: relative; width: 36px; height: 36px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: #334155; display: flex; align-items: center; justify-content: center">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg>
    <span style="position: absolute; top: 4px; right: 4px; min-width: 16px; height: 16px; border-radius: 8px; background: #DC2626; color: #FFFFFF; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center">3</span>
  </button>
  <button type="button" aria-label="Account menu, Sana Malik" style="width: 32px; height: 32px; border-radius: 50%; border: none; background: #E0E7FF; color: #3730A3; font: 600 12.5px Inter, sans-serif">SM</button>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"crumbs":{"editor":"text","default":"SPARK › Repository › Web Application › Login"},"$preview":{"width":1200,"height":60}}'>
class Component extends DCLogic {
  renderVals() {
    const parts = String(this.props.crumbs ?? 'SPARK › Repository › Web Application › Login').split('›').map((s) => s.trim());
    const crumbs = parts.map((label, i) => ({
      label,
      sep: i < parts.length - 1,
      style: i === parts.length - 1 ? 'color:#0F172A;font-weight:600;white-space:nowrap' : 'white-space:nowrap'
    }));
    return { crumbs };
  }
}
</script>
</body>
</html>

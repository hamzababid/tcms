<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Main" style="width: 100%; min-height: 1000px; height: 100%; box-sizing: border-box; background: #111827; color: #CBD5E1; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 16px 12px">
  <div style="display: flex; align-items: center; gap: 10px; padding: 4px 8px">
    <div style="width: 28px; height: 28px; border-radius: 6px; background: #4F46E5; display: flex; align-items: center; justify-content: center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"></path><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"></path></svg>
    </div>
    <span style="font-size: 16px; font-weight: 700; color: #FFFFFF">{{productName}}</span>
  </div>

  <a href="#" style="{{myWork.style}}">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"></path><path d="M21 12a9 9 0 1 1-6.2-8.6"></path></svg>
    My Work
    <span style="margin-left: auto; font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: #4F46E5; color: #FFFFFF">52</span>
  </a>

  <div style="display: flex; flex-direction: column; gap: 2px">
    <button type="button" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border-radius: 6px; border: 1px solid #374151; background: #1F2937; color: #F9FAFB; font: 600 13px Inter, sans-serif; text-align: left; margin-bottom: 8px">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; padding: 1px 6px; border-radius: 4px; background: #374151; color: #E5E7EB">SPARK</span>
      SPARK Platform
      <svg style="margin-left: auto" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 10l5 5 5-5"></path></svg>
    </button>
    <sc-for list="{{items}}" as="it" hint-placeholder-count="10">
      <a href="#" style="{{it.style}}" aria-current="{{it.current}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d}}"></path></svg>
        {{it.label}}
      </a>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 2px">
    <div style="font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #9CA3AF; padding: 0 10px 6px">Organization</div>
    <a href="#" style="{{orgDash.style}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"></path></svg>
      Dashboard
    </a>
    <a href="#" style="{{admin.style}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
      Administration
    </a>
  </div>

  <div style="margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid #1F2937; font-size: 12px; color: #9CA3AF">
    <kbd style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; padding: 1px 5px; border: 1px solid #374151; border-radius: 4px; color: #D1D5DB">?</kbd>
    Keyboard shortcuts
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"repository","options":["mywork","overview","repository","plans","cycles","defects","requirements","traceability","releases","reports","settings","org","admin"]},"productName":{"editor":"text","default":"TCMS"},"$preview":{"width":240,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'repository';
    const base = 'display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:6px;font-size:13.5px;font-weight:500;text-decoration:none;';
    const st = (k) => base + (k === active ? 'background:#312E81;color:#FFFFFF;' : 'color:#D1D5DB;');
    const defs = [
      ['overview', 'Overview', 'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z'],
      ['repository', 'Repository', 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'],
      ['plans', 'Test plans', 'M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1zM8 6H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-2M8 12h8M8 16h5'],
      ['cycles', 'Cycles', 'M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5'],
      ['defects', 'Defects', 'M8 6V4h8v2M5 10h14M6 6h12l-1 13a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2zM10 11v6M14 11v6'],
      ['requirements', 'Requirements', 'M4 6h16M4 12h16M4 18h10'],
      ['traceability', 'Traceability', 'M4 5h5v5H4zM15 14h5v5h-5zM9 7.5h4a2 2 0 0 1 2 2V14'],
      ['releases', 'Releases', 'M4 21V4M4 4h12l-2 4 2 4H4'],
      ['reports', 'Reports', 'M4 20V10M10 20V4M16 20v-7M22 20H2'],
      ['settings', 'Settings', 'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0M14 4v4M8 10v4M16 16v4']
    ];
    const items = defs.map((d) => ({ label: d[1], d: d[2], style: st(d[0]), current: d[0] === active ? 'page' : 'false' }));
    return {
      productName: this.props.productName ?? 'TCMS',
      items,
      myWork: { style: st('mywork') },
      orgDash: { style: st('org') },
      admin: { style: st('admin') }
    };
  }
}
</script>
</body>
</html>

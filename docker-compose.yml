# Local development stack (docs/03 §12.3): db, minio, mailpit, migrate, api, worker, web.
# Settings come from .env (see .env.example). Start with `make up`.
name: assay

x-backend-env: &backend-env
  TCMS_ENV: ${TCMS_ENV:-local}
  TCMS_PRODUCT_NAME: ${TCMS_PRODUCT_NAME:-Assay}
  TCMS_BASE_URL: ${TCMS_BASE_URL:-http://localhost:5173}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  TCMS_SECRET_KEY: ${TCMS_SECRET_KEY}
  TCMS_ENCRYPTION_KEYS: ${TCMS_ENCRYPTION_KEYS}
  DATABASE_URL: postgresql+psycopg://tcms_app:${TCMS_DB_APP_PASSWORD}@db:5432/tcms
  DATABASE_MAINTENANCE_URL: postgresql+psycopg://tcms_owner:${TCMS_DB_OWNER_PASSWORD}@db:5432/tcms
  S3_ENDPOINT_URL: http://minio:9000
  S3_BUCKET: ${S3_BUCKET:-tcms-attachments}
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SESSION_COOKIE_SECURE: "false"

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: dev
  image: assay-backend:dev
  environment: *backend-env
  volumes:
    - ./backend/src:/app/backend/src:ro
    - ./backend/migrations:/app/backend/migrations:ro
    - ./docs/schema:/app/docs/schema:ro

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TCMS_DB_OWNER_PASSWORD: ${TCMS_DB_OWNER_PASSWORD}
      TCMS_DB_APP_PASSWORD: ${TCMS_DB_APP_PASSWORD}
      TCMS_DB_READONLY_PASSWORD: ${TCMS_DB_READONLY_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docs/schema:/schema:ro
      - ./ops/db/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    ports:
      - "127.0.0.1:${TCMS_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tcms"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # Docker Hub no longer publishes minio/minio; Chainguard publishes the same MinIO server.
    image: cgr.dev/chainguard/minio@sha256:a1ac4589a5f8136b616e667b48a0bea9719bb10bd45799ea946f24bbedfafde4
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${TCMS_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${TCMS_MINIO_CONSOLE_PORT:-9001}:9001"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${TCMS_MAILPIT_PORT:-8025}:8025"

  migrate:
    <<: *backend
    command: ["tcms", "migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  storage-init:
    <<: *backend
    command: ["tcms", "storage-init"]
    depends_on:
      minio:
        condition: service_started
    restart: on-failure:10

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:${TCMS_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 3s
      timeout: 3s
      retries: 30

  worker:
    <<: *backend
    command: ["tcms", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    image: assay-web:dev
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_PRODUCT_NAME: ${TCMS_PRODUCT_NAME:-Assay}
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/index.html:/app/frontend/index.html:ro
      - ./frontend/public:/app/frontend/public:ro
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TCMS_WEB_PORT:-5173}:5173"

volumes:
  db-data:
  minio-data:

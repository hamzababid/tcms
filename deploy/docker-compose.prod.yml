# Production stack (docs/03 §12, US-180, docs/ops/deploy.md): Caddy (TLS) → web (nginx, built SPA) and
# api (gunicorn); worker; one-shot migrate; PostgreSQL; MinIO (or any S3: set S3_* and drop the minio
# services). Images are pinned by digest (L1). Secrets are files in deploy/secrets/ (deploy/make-secrets.sh),
# mounted under /run/secrets and read through the *_FILE convention.
#
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/prod.env up -d
name: assay-prod

x-app-env: &app-env
  TCMS_ENV: ${TCMS_ENV:-production}
  TCMS_PRODUCT_NAME: ${TCMS_PRODUCT_NAME:-Assay}
  TCMS_BASE_URL: ${TCMS_BASE_URL:?set TCMS_BASE_URL, e.g. https://assay.example.com}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  TCMS_SECRET_KEY_FILE: /run/secrets/tcms_secret_key
  TCMS_ENCRYPTION_KEYS_FILE: /run/secrets/tcms_encryption_keys
  DATABASE_URL_FILE: /run/secrets/database_url
  DATABASE_MAINTENANCE_URL_FILE: /run/secrets/database_maintenance_url
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  S3_BUCKET: ${S3_BUCKET:-tcms-attachments}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-tcms}
  S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key
  SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD_FILE: /run/secrets/smtp_password
  SMTP_FROM: ${SMTP_FROM:-Assay <no-reply@example.com>}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  SESSION_COOKIE_SECURE: "true"
  # Only Caddy publishes ports; nothing else can reach the api container, so its X-Forwarded-For is trusted (L8).
  FORWARDED_ALLOW_IPS: "*"
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
  RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-600}
  RATE_LIMIT_AUTH_PER_MIN: ${RATE_LIMIT_AUTH_PER_MIN:-20}

x-app: &app
  image: ${TCMS_BACKEND_IMAGE:-assay-backend:prod}
  build:
    context: ..
    dockerfile: backend/Dockerfile
    target: runtime
  environment: *app-env
  secrets: [tcms_secret_key, tcms_encryption_keys, database_url, database_maintenance_url, s3_secret_access_key, smtp_password]
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]

services:
  caddy:
    image: caddy:2.11.9@sha256:ce773ec7a742ce15ee6bf2bb5f65882b9e2a4487b10733e6f1484f86e6b5d8bc
    restart: unless-stopped
    environment:
      TCMS_SITE_ADDRESS: ${TCMS_SITE_ADDRESS:?set TCMS_SITE_ADDRESS (host name, or localhost for the drill)}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
    ports:
      - "${TCMS_HTTP_PORT:-80}:80"
      - "${TCMS_HTTPS_PORT:-443}:443"
      - "${TCMS_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }

  web:
    image: ${TCMS_WEB_IMAGE:-assay-web:prod}
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      target: runtime
    restart: unless-stopped
  
  db:
    image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TCMS_DB_OWNER_PASSWORD_FILE: /run/secrets/db_owner_password
      TCMS_DB_APP_PASSWORD_FILE: /run/secrets/db_app_password
      TCMS_DB_READONLY_PASSWORD_FILE: /run/secrets/db_readonly_password
    secrets: [postgres_password, db_owner_password, db_app_password, db_readonly_password]
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../docs/schema:/schema:ro
      - ../ops/db/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
      - ${TCMS_BACKUP_DIR:-./backups}:/backups
    # Sized for the 4 vCPU / 8 GB host of docs/01 §8.2 (raise with the host). max_connections covers
    # API_REPLICAS × (DB_POOL_SIZE + DB_MAX_OVERFLOW) plus the worker and maintenance sessions.
    command:
      [
        "postgres",
        "-c", "shared_buffers=${PG_SHARED_BUFFERS:-2GB}",
        "-c", "effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-5GB}",
        "-c", "work_mem=${PG_WORK_MEM:-32MB}",
        "-c", "maintenance_work_mem=256MB",
        "-c", "random_page_cost=1.1",
        "-c", "max_connections=${PG_MAX_CONNECTIONS:-200}",
        "-c", "log_min_duration_statement=${PG_LOG_MIN_DURATION_MS:-1000}",
      ]
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tcms"]
      interval: 5s
      timeout: 3s
      retries: 30
  
  minio:
    image: cgr.dev/chainguard/minio@sha256:a1ac4589a5f8136b616e667b48a0bea9719bb10bd45799ea946f24bbedfafde4
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-tcms}
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/s3_secret_access_key
    secrets: [s3_secret_access_key]
    volumes:
      - minio-data:/data
  
  migrate:
    <<: *app
    command: ["tcms", "migrate"]
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  storage-init:
    <<: *app
    command: ["tcms", "storage-init"]
    restart: on-failure:10
    depends_on:
      minio: { condition: service_started }

  api:
    <<: *app
    # One process per replica, balanced by Caddy (least connections). Scale with API_REPLICAS
    # (about one per CPU core; docs/ops/deploy.md).
    command:
      [
        "gunicorn", "tcms.main:create_app()", "--worker-class", "uvicorn.workers.UvicornWorker",
        "--bind", "0.0.0.0:8000", "--workers", "1", "--forwarded-allow-ips", "*",
        "--access-logfile", "-", "--graceful-timeout", "30", "--no-control-socket",
        # Longer than Caddy keeps idle upstream connections (60 s), so Caddy never reuses a connection
        # the API is closing (502 "connection reset by peer", M8c load test).
        "--keep-alive", "75",
      ]
    deploy:
      replicas: ${API_REPLICAS:-2}
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    <<: *app
    command: ["tcms", "worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }

secrets:
  tcms_secret_key: { file: ./secrets/tcms_secret_key }
  tcms_encryption_keys: { file: ./secrets/tcms_encryption_keys }
  database_url: { file: ./secrets/database_url }
  database_maintenance_url: { file: ./secrets/database_maintenance_url }
  s3_secret_access_key: { file: ./secrets/s3_secret_access_key }
  smtp_password: { file: ./secrets/smtp_password }
  postgres_password: { file: ./secrets/postgres_password }
  db_owner_password: { file: ./secrets/db_owner_password }
  db_app_password: { file: ./secrets/db_app_password }
  db_readonly_password: { file: ./secrets/db_readonly_password }

volumes:
  db-data:
  minio-data:
  caddy-data:
  caddy-config:
